<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="sidebar(active)" class="w-60 bg-slate-900 text-slate-100 flex flex-col">
  <div class="px-5 py-5 border-b border-slate-700">
    <div class="text-lg font-semibold">Chat Admin</div>
    <div class="text-xs text-slate-400">Control panel</div>
  </div>

  <ul class="flex-1 py-4 space-y-1">
    <li>
      <a href="/admin"
         th:classappend="${active == 'dashboard'} ? ' bg-slate-800 text-white' : ' hover:bg-slate-800/60'"
         class="block px-5 py-2 text-sm">Dashboard</a>
    </li>
    <li>
      <a href="/admin/users"
         th:classappend="${active == 'users'} ? ' bg-slate-800 text-white' : ' hover:bg-slate-800/60'"
         class="block px-5 py-2 text-sm">Users</a>
    </li>
    <li>
      <a href="/admin/rooms"
         th:classappend="${active == 'rooms'} ? ' bg-slate-800 text-white' : ' hover:bg-slate-800/60'"
         class="block px-5 py-2 text-sm">Rooms</a>
    </li>
    <li>
      <a href="/admin/moderation"
         th:classappend="${active == 'moderation'} ? ' bg-slate-800 text-white' : ' hover:bg-slate-800/60'"
         class="block px-5 py-2 text-sm">Moderation</a>
    </li>
  </ul>

  <form th:action="@{/admin/logout}" method="post" class="p-4 border-t border-slate-700">
    <button type="submit" class="w-full text-left text-sm text-slate-300 hover:text-white">Sign out</button>
  </form>
</nav>

</body>
</html>
