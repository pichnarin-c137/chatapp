<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content}, 'Users', 'users')}">
<body>
<div th:fragment="content">

  <div class="bg-white rounded-lg shadow">
    <div class="p-4 border-b border-slate-200 flex items-center gap-3">
      <input type="search"
             name="q"
             th:value="${q}"
             placeholder="Search by username or email…"
             class="flex-1 px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-slate-500"
             hx-get="/admin/users/rows"
             hx-trigger="keyup changed delay:300ms, search"
             hx-target="#users-tbody"
             hx-swap="outerHTML"
             hx-include="this"/>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-100 text-slate-600 text-left text-xs uppercase">
          <tr>
            <th class="px-4 py-3">Username</th>
            <th class="px-4 py-3">Email</th>
            <th class="px-4 py-3">Role</th>
            <th class="px-4 py-3">Created</th>
            <th class="px-4 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody th:fragment="tableBody" id="users-tbody" class="divide-y divide-slate-200">
          <th:block th:each="u : ${users}">
            <tr th:replace="~{admin/users/_row :: userRow(${u})}"></tr>
          </th:block>
          <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="5" class="px-4 py-8 text-center text-slate-500">No users found.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="p-4">
      <div th:replace="~{admin/fragments/pagination :: pagination(${page}, ${totalPages}, '/admin/users')}"></div>
    </div>
  </div>

</div>
</body>
</html>
