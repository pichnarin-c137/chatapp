<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, title, activeNav)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' · Chat Admin'">Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <meta name="_csrf" th:content="${_csrf?.token}"/>
  <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
  <script>
    document.addEventListener('htmx:configRequest', (e) => {
      const t = document.querySelector('meta[name="_csrf"]')?.content;
      const h = document.querySelector('meta[name="_csrf_header"]')?.content;
      if (t && h) e.detail.headers[h] = t;
    });
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

<div class="flex min-h-screen">
  <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeNav})}"></div>

  <main class="flex-1 flex flex-col">
    <div th:replace="~{admin/fragments/header :: header(${title})}"></div>
    <div class="p-6 flex-1">
      <div th:replace="${content}"></div>
    </div>
  </main>
</div>

</body>
</html>
