services:
  postgres:
    image: postgres:18-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: chat-backend
    working_dir: /app
    command: mvn spring-boot:run
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chatdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://0.0.0.0:3000,http://127.0.0.1:3000
      APP_JWT_SECRET: dev-secret-change-me-256-bit-minimum-please-rotate-in-prod
      APP_JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: chat-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8081
      NUXT_PUBLIC_WS_BASE: ws://localhost:8081/ws
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  postgres_data:
  maven_cache:
  frontend_node_modules:
