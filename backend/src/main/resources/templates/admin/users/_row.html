<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<tr th:fragment="userRow(u)" th:id="'user-' + ${u.id}">
  <td class="px-4 py-3 font-medium text-slate-800" th:text="${u.username}">user</td>
  <td class="px-4 py-3 text-slate-600" th:text="${u.email}">user@example.com</td>
  <td class="px-4 py-3">
    <span th:text="${u.role}"
          th:classappend="${u.role.name() == 'ADMIN'} ? ' bg-amber-100 text-amber-700' : ' bg-slate-100 text-slate-600'"
          class="inline-block px-2 py-0.5 rounded text-xs font-medium">USER</span>
  </td>
  <td class="px-4 py-3 text-slate-500" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
  <td class="px-4 py-3 text-right space-x-2">
    <button class="text-xs px-2 py-1 border border-slate-300 rounded hover:bg-slate-100"
            th:hx-post="@{'/admin/users/' + ${u.id} + '/toggle-role'}"
            th:hx-target="'#user-' + ${u.id}"
            hx-swap="outerHTML">
      Toggle role
    </button>
    <button class="text-xs px-2 py-1 border border-red-300 text-red-600 rounded hover:bg-red-50"
            th:hx-delete="@{'/admin/users/' + ${u.id}}"
            th:hx-target="'#user-' + ${u.id}"
            hx-swap="outerHTML"
            hx-confirm="Delete this user? This cannot be undone.">
      Delete
    </button>
  </td>
</tr>

</body>
</html>
