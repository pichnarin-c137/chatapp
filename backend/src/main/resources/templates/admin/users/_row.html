<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<tr th:fragment="userRow(u)" th:id="'user-' + ${u.id}">
  <td class="px-4 py-3 font-medium text-slate-800">
    <a th:href="@{'/admin/users/' + ${u.id}}" class="hover:underline" th:text="${u.username}">user</a>
  </td>
  <td class="px-4 py-3 text-slate-600" th:text="${u.email}">user@example.com</td>
  <td class="px-4 py-3">
    <span th:text="${u.status}"
          th:classappend="${u.status.name() == 'ACTIVE'} ? ' bg-emerald-100 text-emerald-700' : ' bg-amber-100 text-amber-700'"
          class="inline-block px-2 py-0.5 rounded text-xs font-medium">ACTIVE</span>
  </td>
  <td class="px-4 py-3 text-slate-500" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
  <td class="px-4 py-3 text-right space-x-2">
    <button class="text-xs px-2 py-1 border border-slate-300 rounded hover:bg-slate-100"
            th:hx-post="@{'/admin/users/' + ${u.id} + '/toggle-status'}"
            th:hx-target="'#user-' + ${u.id}"
            hx-swap="outerHTML">
      Toggle status
    </button>
    <button class="text-xs px-2 py-1 border border-red-300 text-red-600 rounded hover:bg-red-50"
            th:hx-delete="@{'/admin/users/' + ${u.id}}"
            th:hx-target="'#user-' + ${u.id}"
            hx-swap="outerHTML"
            hx-confirm="Soft-delete this user? They will no longer be able to sign in but the audit trail is preserved.">
      Delete
    </button>
  </td>
</tr>

</body>
</html>
