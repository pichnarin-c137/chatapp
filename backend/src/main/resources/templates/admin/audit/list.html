<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content}, 'Audit log', 'audit')}">
<body>
<div th:fragment="content">

  <div class="bg-white rounded-lg shadow">
    <div class="p-4 border-b border-slate-200">
      <h2 class="text-sm font-semibold text-slate-700">Recent activity</h2>
      <p class="text-xs text-slate-500 mt-1">Every create / update / delete is captured automatically.</p>
    </div>
    <table class="w-full text-sm">
      <thead class="bg-slate-100 text-slate-600 text-left text-xs uppercase">
        <tr>
          <th class="px-4 py-3">When</th>
          <th class="px-4 py-3">Actor</th>
          <th class="px-4 py-3">Action</th>
          <th class="px-4 py-3">Entity</th>
          <th class="px-4 py-3">ID</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        <tr th:each="r : ${rows}" class="hover:bg-slate-50">
          <td class="px-4 py-3 text-slate-500 text-xs font-mono whitespace-nowrap"
              th:text="${#temporals.format(r.at, 'yyyy-MM-dd HH:mm:ss')}">2026-05-17 13:00:00</td>
          <td class="px-4 py-3" th:text="${r.actorUserId != null ? usernames.getOrDefault(r.actorUserId, 'unknown') : 'system'}">user</td>
          <td class="px-4 py-3">
            <span th:text="${r.action}"
                  th:classappend="${r.action.name() == 'CREATE'} ? ' bg-emerald-100 text-emerald-700' :
                                  (${r.action.name() == 'DELETE'} ? ' bg-red-100 text-red-700' : ' bg-slate-100 text-slate-700')"
                  class="inline-block px-2 py-0.5 rounded text-xs font-medium font-mono">CREATE</span>
          </td>
          <td class="px-4 py-3 font-mono text-xs text-slate-700"
              th:text="${#strings.substringAfter(r.entityType, 'chatapp.backend.')}">Entity</td>
          <td class="px-4 py-3 font-mono text-xs text-slate-500" th:text="${#strings.abbreviate(r.entityId, 16)}">id</td>
        </tr>
        <tr th:if="${#lists.isEmpty(rows)}">
          <td colspan="5" class="px-4 py-8 text-center text-slate-500">No audit entries yet.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{admin/fragments/pagination :: pagination(${page}, ${totalPages}, '/admin/audit')}"></div>

</div>
</body>
</html>
