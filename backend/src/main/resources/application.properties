spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# We only use Redis for caching/idempotency — disable repository scan to silence
# "could not identify store" warnings about our JPA repositories.
spring.data.redis.repositories.enabled=false

# Flyway owns the schema. Hibernate validates that entities match it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Surface the exception message in error responses so the frontend can show
# "Email already registered" / "Invalid credentials" instead of a bare 409/401.
server.error.include-message=always

app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-256-bit-minimum-please-rotate-in-prod}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
