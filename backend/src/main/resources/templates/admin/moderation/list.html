<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content}, 'Moderation', 'moderation')}">
<body>
<div th:fragment="content">

  <div class="bg-white rounded-lg shadow">
    <div class="p-4 border-b border-slate-200">
      <h2 class="text-sm font-semibold text-slate-700">Open reports</h2>
      <p class="text-xs text-slate-500 mt-1">Review the reported message, then either delete it or mark the report resolved.</p>
    </div>

    <div class="divide-y divide-slate-200">
      <div th:each="row : ${rows}" th:id="'report-' + ${row.report.id}" class="p-4">
        <div class="flex justify-between items-start gap-4">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 text-xs text-slate-500">
              <span>Reported by <span class="font-medium text-slate-700" th:text="${row.reporterUsername}">alice</span></span>
              <span>·</span>
              <span th:text="${#temporals.format(row.report.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-17 10:00</span>
            </div>
            <div th:if="${row.report.reason}" class="mt-1 text-xs text-slate-600 italic">
              Reason: <span th:text="${row.report.reason}">spam</span>
            </div>

            <div class="mt-3 p-3 rounded bg-slate-50 border border-slate-200" th:if="${row.message != null}">
              <div class="text-xs text-slate-500 mb-1">
                <span class="font-medium text-slate-700" th:text="${row.senderUsername}">bob</span>
                <span class="ml-2" th:text="${#temporals.format(row.message.sentAt, 'yyyy-MM-dd HH:mm')}">2026-05-17 09:50</span>
              </div>
              <div class="text-sm text-slate-800 whitespace-pre-wrap break-words" th:text="${row.message.content}">message content</div>
            </div>
            <div th:if="${row.message == null}" class="mt-3 p-3 rounded bg-slate-50 border border-slate-200 text-xs text-slate-500 italic">
              Original message no longer exists.
            </div>
          </div>

          <div class="flex flex-col gap-2 shrink-0">
            <button th:if="${row.message != null}"
                    class="text-xs px-3 py-1 border border-red-300 text-red-600 rounded hover:bg-red-50"
                    th:hx-delete="@{'/admin/moderation/messages/' + ${row.message.id}}"
                    th:hx-target="'#report-' + ${row.report.id}"
                    hx-swap="outerHTML"
                    hx-confirm="Delete this message? All linked reports will be resolved.">
              Delete message
            </button>
            <button class="text-xs px-3 py-1 border border-slate-300 rounded hover:bg-slate-100"
                    th:hx-post="@{'/admin/moderation/reports/' + ${row.report.id} + '/resolve'}"
                    th:hx-target="'#report-' + ${row.report.id}"
                    hx-swap="outerHTML">
              Dismiss
            </button>
          </div>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(rows)}" class="p-8 text-center text-slate-500 text-sm">
        No open reports. Nice and quiet.
      </div>
    </div>
  </div>

  <div th:replace="~{admin/fragments/pagination :: pagination(${page}, ${totalPages}, '/admin/moderation')}"></div>

</div>
</body>
</html>
