<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content}, ${pageTitle}, 'users')}">
<body>
<div th:fragment="content">

  <a href="/admin/users" class="text-xs text-slate-500 hover:underline">← back to users</a>

  <div class="mt-3 grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="bg-white rounded-lg shadow p-5 lg:col-span-1">
      <div class="text-xs uppercase text-slate-500">Username</div>
      <div class="text-lg font-semibold mt-1" th:text="${u.username}">user</div>
      <div class="text-xs text-slate-500 mt-3">Email</div>
      <div class="text-sm font-mono break-all" th:text="${u.email}">user@example.com</div>
      <div class="text-xs text-slate-500 mt-3">Status</div>
      <div class="text-sm" th:text="${u.status}">ACTIVE</div>
      <div class="text-xs text-slate-500 mt-3">Created</div>
      <div class="text-sm" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</div>
      <div class="text-xs text-slate-500 mt-3">User id</div>
      <div class="text-xs font-mono text-slate-700 break-all" th:text="${u.id}">id</div>
    </div>

    <div class="bg-white rounded-lg shadow p-5 lg:col-span-2">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">Roles</h2>
      <div id="roles-panel"
           hx-get="${'/admin/roles/user/' + u.id}"
           th:hx-get="@{'/admin/roles/user/' + ${u.id}}"
           hx-trigger="load"
           hx-target="#roles-panel"
           hx-swap="outerHTML">
        <div class="text-xs text-slate-500">Loading roles…</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
