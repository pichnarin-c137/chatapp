<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">

<div class="w-full max-w-sm bg-white rounded-lg shadow p-8">
  <h1 class="text-xl font-semibold text-slate-800 mb-1">Chat Admin</h1>
  <p class="text-sm text-slate-500 mb-6">Sign in to continue</p>

  <div th:if="${param.error}" class="mb-4 p-3 rounded bg-red-50 text-red-700 text-sm">
    Invalid credentials or not an admin account.
  </div>
  <div th:if="${param.logout}" class="mb-4 p-3 rounded bg-emerald-50 text-emerald-700 text-sm">
    You have been signed out.
  </div>

  <form th:action="@{/admin/login}" method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="username">Username or email</label>
      <input id="username" name="username" type="text" required autofocus
             class="w-full px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-slate-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required
             class="w-full px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-slate-500"/>
    </div>
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit"
            class="w-full py-2 bg-slate-900 text-white rounded hover:bg-slate-800 transition">
      Sign in
    </button>
  </form>
</div>

</body>
</html>
