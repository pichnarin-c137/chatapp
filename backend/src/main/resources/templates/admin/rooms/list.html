<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content}, 'Rooms', 'rooms')}">
<body>
<div th:fragment="content">

  <div class="flex justify-between items-center mb-4">
    <div></div>
    <a href="/admin/rooms/new"
       class="px-4 py-2 bg-slate-900 text-white text-sm rounded hover:bg-slate-800">+ New room</a>
  </div>

  <div class="bg-white rounded-lg shadow overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-100 text-slate-600 text-left text-xs uppercase">
        <tr>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Type</th>
          <th class="px-4 py-3">Created</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        <tr th:each="r : ${rooms}" th:id="'room-' + ${r.id}">
          <td class="px-4 py-3 font-medium text-slate-800" th:text="${r.name ?: '(unnamed)'}">Lobby</td>
          <td class="px-4 py-3">
            <span class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-600"
                  th:text="${r.type}">GROUP</span>
          </td>
          <td class="px-4 py-3 text-slate-500" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
          <td class="px-4 py-3 text-right space-x-2">
            <a th:href="@{'/admin/rooms/' + ${r.id} + '/edit'}"
               class="text-xs px-2 py-1 border border-slate-300 rounded hover:bg-slate-100">Edit</a>
            <button class="text-xs px-2 py-1 border border-red-300 text-red-600 rounded hover:bg-red-50"
                    th:hx-delete="@{'/admin/rooms/' + ${r.id}}"
                    th:hx-target="'#room-' + ${r.id}"
                    hx-swap="outerHTML"
                    hx-confirm="Delete this room? Messages stay but the room reference will be orphaned.">
              Delete
            </button>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(rooms)}">
          <td colspan="4" class="px-4 py-8 text-center text-slate-500">No rooms yet.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{admin/fragments/pagination :: pagination(${page}, ${totalPages}, '/admin/rooms')}"></div>

</div>
</body>
</html>
