<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content}, ${pageTitle}, 'conversations')}">
<body>
<div th:fragment="content">

  <div class="max-w-lg bg-white rounded-lg shadow p-6">
    <form th:action="@{${formAction}}" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="name">Name</label>
        <input id="name" name="name" type="text" required maxlength="64"
               th:value="${conv.name}"
               class="w-full px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-slate-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="topic">Topic</label>
        <input id="topic" name="topic" type="text" maxlength="255"
               th:value="${conv.topic}"
               class="w-full px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-slate-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="type">Type</label>
        <select id="type" name="type"
                class="w-full px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-slate-500">
          <option value="GROUP"   th:selected="${conv.type?.name() == 'GROUP'}">Group</option>
          <option value="CHANNEL" th:selected="${conv.type?.name() == 'CHANNEL'}">Channel</option>
        </select>
      </div>

      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="flex gap-2 pt-2">
        <button type="submit"
                class="px-4 py-2 bg-slate-900 text-white text-sm rounded hover:bg-slate-800"
                th:text="${submitLabel}">Save</button>
        <a href="/admin/conversations"
           class="px-4 py-2 border border-slate-300 text-sm rounded hover:bg-slate-100">Cancel</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
