<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content}, 'Roles & permissions', 'roles')}">
<body>
<div th:fragment="content">

  <div class="bg-white rounded-lg shadow">
    <div class="p-4 border-b border-slate-200">
      <h2 class="text-sm font-semibold text-slate-700">Roles</h2>
      <p class="text-xs text-slate-500 mt-1">System roles are seeded by V1 and can't be deleted. Click a role to view its permissions.</p>
    </div>
    <table class="w-full text-sm">
      <thead class="bg-slate-100 text-slate-600 text-left text-xs uppercase">
        <tr>
          <th class="px-4 py-3">Code</th>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Description</th>
          <th class="px-4 py-3">System</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        <tr th:each="r : ${roles}" class="hover:bg-slate-50">
          <td class="px-4 py-3 font-mono text-xs text-slate-700">
            <a th:href="@{'/admin/roles/' + ${r.id}}" th:text="${r.code}" class="hover:underline">CODE</a>
          </td>
          <td class="px-4 py-3 font-medium" th:text="${r.name}">Name</td>
          <td class="px-4 py-3 text-slate-600" th:text="${r.description ?: '—'}">—</td>
          <td class="px-4 py-3">
            <span th:if="${r.systemRole}" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-slate-200 text-slate-700">system</span>
            <span th:unless="${r.systemRole}" class="text-slate-400 text-xs">custom</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
